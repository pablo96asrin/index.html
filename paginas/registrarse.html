<!doctype html>
<html lang="es_AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse</title>
    <link
      rel="shortcut icon"
      href="../img/icons8-despegue-100.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body>
    <header class="color-de-fondo color-de-letra imag-header">
      <a href="../index.html"
        ><img
          src="../img/icons8-bosque-100.png"
          alt="una hoja silvestre y un arbol"
      /></a>
      <nav class="menu-nav-principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contactos.html">Contactos</a></li>
          <li><a href="./sobre-nosotros.html">Sobre Nosotros</a></li>
        </ul>
        <ul>
          <li><a href="./iniciar-sesión.html">Iniciar Sesión</a></li>
          <li><a href="./registrarse.html">Registrarse</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form class="formulario-reg" action="">
        <label for="idnombreusuario"> Nombre de Usuario</label>
        <input
          type="text"
          id="idnombreusuario"
          placeholder="Por ejemplo: Usuario123"
          required
          minlength="6"
          maxlength="20"
        />
        <br />
        <label for="idemailusuario"> Correo del Usuario</label>
        <input
          type="email"
          name=""
          id="idemailusuario"
          required
          minlength="6"
          maxlength="50"
        />
        <br />
        <label for="telefonousuario"> Teléfono Usuario </label>
        <input
          type="tel"
          value=""
          required
          minlength="6"
          maxlength="15"
          id="telefonousuario"
        />
        <br />
        <label for="idcontrasenia"> Contraseña </label>
        <input
          id="idcontrasenia"
          type="password"
          required
          minlength="8"
          maxlength="20"
        />
        <br />
        <label for="repcontrasenia"> Confirmar Contraseña </label>
        <input
          id="repcontrasenia"
          type="password"
          required
          minlength="8"
          maxlength="20"
        />
        <br />
        <input type="checkbox" name="" id="" required />
        <label for="">Aceptar terminos y condiciones</label>
        <br />
        <button type="submit">Enviar Datos</button>
        <p>
          ¿Ya tenes una cuenta?<a href="./iniciar-sesión.html"
            >Inicia sesión aqui</a
          >
        </p>
      </form>
      <section class="formulario-reg">
        <p>Registrate con:</p>
        <br />
        <button>Google</button>
        <small>o</small>
        <button>Facebook</button>
      </section>
    </main>
    <footer class="footer">
      <section>
        <a href="../index.html"
          ><img
            src="../img/icons8-bosque-100.png"
            alt="una hoja silvestre y un arbol"
        /></a>
      </section>
      <section>
        <ul>
          <li><a href="">Terminos y condiciones</a></li>
          <li><a href="">Trabaja con nosotros</a></li>
          <li><a href="">Contactos</a></li>
        </ul>
      </section>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d12906.025315899362!2d-65.6095726407428!3d-27.417583799008806!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2s!5e0!3m2!1ses!2sar!4v1793775630237!5m2!1ses!2sar"
        width="450"
        height="300"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </footer>
  </body>
</html>
